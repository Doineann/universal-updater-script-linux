#!/usr/bin/env bash
#
# ============================
# Universal Updater - Config
# ============================
# Template configuration for any application.
#

# ------------------------------------------------------------
# APP INFO
# ------------------------------------------------------------
# Human-readable name of the app
UPDATER_APP_NAME="App"
# Destination directory where the app will be installed
UPDATER_DEST_DIR="./app"

# Keep a backup of the previous version (1=yes, 0=no)
UPDATER_KEEP_BACKUP_VERSION=1

# ------------------------------------------------------------
# UPDATE SOURCE (first non-empty wins)
# ------------------------------------------------------------
# GitHub releases (recommended)
UPDATER_GITHUB_USER="appuser"
UPDATER_GITHUB_REPO="apprepo"
UPDATER_GITHUB_ARTIFACT_PATTERN="app-linux-amd64"

# Direct download URL (latest served or redirected)
UPDATER_DOWNLOAD_LATEST_URL="https://app-website.com/download/latest/linux/x64?format=AppImage"

# Custom command:
# Must output EXACTLY three lines:
#   line 1 → version
#   line 2 → filename
#   line 3 → url
UPDATER_CUSTOM_LATEST_COMMAND=""

# ------------------------------------------------------------
# VERSION EXTRACTION
# ------------------------------------------------------------
# Choose how to extract version:
#   tag      → use GitHub tag directly
#   filename → extract version from filename
#   header   → extract version from HTTP headers
#   custom   → version provided by custom command
UPDATER_VERSION_SOURCE="tag"

# Regex used when version source = filename/header
UPDATER_VERSION_REGEX="App-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz"

# ------------------------------------------------------------
# RUNTIME / HOOKS
# ------------------------------------------------------------
# Executable name for running detection (pgrep -x)
UPDATER_APP_MAIN_EXECUTABLE="app"

# Commands executed only when an update happens
UPDATER_PRE_INSTALL_COMMAND="./pre-update.sh"
UPDATER_POST_INSTALL_COMMAND="./post-update.sh"

# Commands to stop/restart the app
UPDATER_APP_STOP_COMMAND="./stop.sh"
UPDATER_APP_RESTART_COMMAND="./start.sh"

# Extraction command (auto-detected if empty)
UPDATER_EXTRACT_COMMAND=""
